services:
  # SQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todoos-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong!Password123}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - todoos-network
    restart: unless-stopped

  # API Backend
  api:
    build:
      context: ./src
      dockerfile: TaqTask.Api/Dockerfile
    container_name: todoos-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=ToDoOS;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Password123};TrustServerCertificate=True
      - JwtSettings__SecretKey=${JWT_SECRET:-ChangeMeInProduction}
      - JwtSettings__Issuer=${JWT_ISSUER:-ToDoOS}
      - JwtSettings__Audience=${JWT_AUDIENCE:-ToDoOS-Users}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-https://yourdomain.com}
    depends_on:
      mssql:
        condition: service_started
    networks:
      - todoos-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: todoos-frontend
    networks:
      - todoos-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: todoos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api
      - frontend
    networks:
      - todoos-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  todoos-network:
    driver: bridge
