services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: todoos-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-rootpass123}
      - MYSQL_DATABASE=ToDoOS
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todoos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 10

  # API Backend
  api:
    build:
      context: ./src
      dockerfile: TaqTask.Api/Dockerfile
    container_name: todoos-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=ToDoOS;User=root;Password=${MYSQL_PASSWORD:-rootpass123}
      - JwtSettings__SecretKey=${JWT_SECRET:-ChangeMeInProduction}
      - JwtSettings__Issuer=${JWT_ISSUER:-ToDoOS}
      - JwtSettings__Audience=${JWT_AUDIENCE:-ToDoOS-Users}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-https://yourdomain.com}
    depends_on:
      mssql:
        condition: service_started
    networks:
      - todoos-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: todoos-frontend
    networks:
      - todoos-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: todoos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api
      - frontend
    networks:
      - todoos-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  todoos-network:
    driver: bridge
